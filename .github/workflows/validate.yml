name: Validate game and UI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: npm ci --prefix tests/ui --ignore-scripts

      - name: Check client and server brain synchronization
        run: node sync-rami-brain.js --check

      - name: Check all application scripts
        run: npm run check:syntax --prefix tests/ui

      - name: Check game rules, interactions, audio and accounting
        run: node --test tests/*.test.cjs

      - name: Check simulated login, table, chat and accounting flows
        run: npm test --prefix tests/ui
