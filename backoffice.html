        +'</div></div>';
    }
    window.__boFail=fail;
    window.addEventListener('error',function(e){
      // כשל בטעינת <script> חיצוני (React/Babel מ-CDN)
      if(e && e.target && e.target.tagName==='SCRIPT'){ fail('נכשלה טעינת רכיב מהרשת. בדוק חיבור-אינטרנט ונסה שוב.'); }
    },true);
    window.addEventListener('DOMContentLoaded',function(){
      setTimeout(function(){
        if(!window.__boMounted){
          if(!window.React||!window.ReactDOM){ fail('ספריות התצוגה לא נטענו (רשת/חוסם-פרסומות). נסה רשת אחרת או רענן.'); }
          else if(!window.Babel){ fail('מנוע-התצוגה לא נטען (רשת). רענן את הדף.'); }

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const T = window.__TENANT;
const TENANT_SLUG = window.__TENANT_SLUG;
const ROLES = { SUPER_ADMIN:'super_admin', CLUB_OWNER:'club_owner', MANAGER:'manager', AGENT:'agent', PLAYER:'player' };

const round2 = (n)=>Math.round((Number(n)||0)*100)/100;
const money = (n)=>{ const v=round2(n); return (v<0?'-':'')+Math.abs(v).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const col = (n)=> n>0.009?'var(--pos)':n<-0.009?'var(--neg)':'var(--muted)';

function cycleStartIL(weeksBack, now = new Date()) {
  const formatter = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const wallTime = epoch => {
    const parts = Object.fromEntries(formatter.formatToParts(new Date(epoch)).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
    return Date.UTC(parts.year,parts.month-1,parts.day,parts.hour,parts.minute,parts.second);
  };
  const wall = wallTime(now.getTime());
  const date = new Date(wall), daysBack = (date.getUTCDay()+5)%7;
  let target = Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()-daysBack,0,1);
  if (wall < target) target -= 7*86400000;
  target -= (Number(weeksBack)||0)*7*86400000;
  let epoch = target;
  for(let i=0;i<3;i++) epoch = target - (wallTime(epoch)-epoch);
  return epoch;
}
function closedWeekEntry(weeks, start) {
  if(weeks?.[String(start)]) return [String(start),weeks[String(start)]];
  // Old releases included current milliseconds in the key. Keep those records readable.
  return Object.entries(weeks||{}).filter(([key])=>Math.floor(Number(key)/1000)===Math.floor(start/1000)).sort((a,b)=>(b[1]?.at||0)-(a[1]?.at||0))[0] || null;
}
function cycleLabel(weeksBack){
  const s = cycleStartIL(weeksBack);
  const e = weeksBack===0 ? Date.now() : cycleStartIL(weeksBack-1);
  const f = (t)=> new Date(t).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  return `${f(s)} — ${f(e-1)}` + (weeksBack===0 ? ' (נוכחי)' : '');
}
function Spinner(){ return <span style={{display:'inline-block',width:16,height:16,border:'2px solid rgba(255,255,255,.25)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>; }
function Center({children}){ return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)',fontWeight:700}}>{children}</div>; }

// ═══ שורש ללא-דייר → דף-נחיתה ═══
function Landing(){
  const tenants = Object.entries(window.__TENANTS||{});
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{textAlign:'center',maxWidth:460}}>
        <div style={{fontWeight:900,letterSpacing:'.2em',color:'var(--brand)',fontSize:14}}>CLUBCULATION</div>
        <h1 style={{fontSize:30,fontWeight:900,margin:'10px 0 6px'}}>מערכת התחשבנות לקלאבים</h1>
        <p style={{color:'var(--muted)',fontWeight:600,marginBottom:22}}>בחר קלאב, או פתח את הקישור הישיר של הקלאב שלך.</p>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center'}}>
          {tenants.map(([slug,t])=>(
            <a key={slug} href={'/'+slug} style={{textDecoration:'none',background:'var(--panel)',border:'1px solid var(--line)',borderRadius:16,padding:'14px 22px',fontWeight:900,color:'var(--ink)'}}>{t.name} ←</a>
          ))}
          {tenants.length===0 && <div style={{color:'var(--faint)',fontWeight:700}}>לא הוגדרו קלאבים עדיין.</div>}
        </div>
      </div>
    </div>
  );
}

function App(){
  if(!T) return <Landing/>;
  const [ready,setReady] = useState(!!window.fb);
  const [authUser,setAuthUser] = useState(undefined);
  const [err,setErr] = useState('');
  useEffect(()=>{ if(window.fb){setReady(true);return;} const h=()=>setReady(true); window.addEventListener('fb-ready',h); return ()=>window.removeEventListener('fb-ready',h); },[]);
  useEffect(()=>{
    if(!ready||!window.fb) return;
    try{ window.fb.getRedirectResult(window.fb.auth).catch(()=>{}); }catch(e){}
    const un = window.fb.onAuthStateChanged(window.fb.auth,(u)=>setAuthUser(u||null));
    return ()=>un();
  },[ready]);
  const login = async ()=>{ setErr('');
    try{ await window.fb.signInWithPopup(window.fb.auth, window.fb.googleProvider); }
    catch(e){ try{ await window.fb.signInWithRedirect(window.fb.auth, window.fb.googleProvider); }catch(e2){ setErr('ההתחברות נכשלה. פתח בדפדפן רגיל ונסה שוב.'); } }
  };
  if(!ready||authUser===undefined) return <Center><Spinner/> <span style={{marginRight:8}}>טוען…</span></Center>;
  if(!authUser) return <Login onLogin={login} err={err}/>;
  return <Board authUser={authUser} onLogout={()=>window.fb.signOut(window.fb.auth)} />;
}

function Login({onLogin,err}){
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:380,background:'var(--panel)',border:'1px solid var(--line)',borderRadius:24,padding:'34px 26px',textAlign:'center',boxShadow:'0 30px 70px rgba(0,0,0,.5)'}}>
        <div style={{fontWeight:900,letterSpacing:'.18em',color:'var(--brand)',fontSize:13}}>CLUBCULATION</div>
        <h1 style={{fontSize:23,fontWeight:900,margin:'8px 0 2px'}}>{T.name} · התחשבנות</h1>
        <p style={{color:'var(--muted)',fontSize:13,fontWeight:600,marginBottom:22}}>בעלי-קלאב · סוכנים · שחקנים</p>
        <button onClick={onLogin} style={{width:'100%',padding:'13px',borderRadius:14,border:0,background:'linear-gradient(180deg,#22d3ee,#0891b2)',color:'#04121a',fontWeight:900,fontSize:15}}>התחבר עם Google</button>
        {err && <div style={{color:'var(--neg)',fontSize:12,fontWeight:700,marginTop:12}}>{err}</div>}
        <p style={{color:'var(--faint)',fontSize:12,fontWeight:700,marginTop:18,lineHeight:1.6}}>שחקנים ללא Google — היכנסו דרך כפתור <b style={{color:'var(--muted)'}}>"פירוט חשבון · התחשבנות"</b> בתוך האפליקציה. אתם כבר מחוברים, והמסך ייפתח ישירות לתוצאות שלכם.</p>
      </div>
    </div>
  );
}

function Board({authUser,onLogout}){
  const email = (authUser.email||'').toLowerCase();
  const isGod = (T.godEmails||[]).includes(email);
  const [mems,setMems]=useState(null),[logs,setLogs]=useState(null),[club,setClub]=useState(null);
  const [wk,setWk]=useState(0),[q,setQ]=useState(''),[sortBy,setSortBy]=useState('result'),[drill,setDrill]=useState(null),[loadErr,setLoadErr]=useState('');
  const [reload,setReload]=useState(0);

  useEffect(()=>{ let alive=true;setLoadErr('');setMems(null);setLogs(null);(async()=>{
    try{
      const [ms,ls,cs] = await Promise.all([
        window.fb.getDocs(window.fb.query(window.fb.collection(window.fb.db,'memberships'), window.fb.where('clubId','==',T.clubId))),
        window.fb.getDocs(window.fb.query(window.fb.collection(window.fb.db,'gameLog'), window.fb.where('clubId','==',T.clubId))),
        window.fb.getDoc(window.fb.doc(window.fb.db,'clubs',T.clubId)),
      ]);
      if(!alive)return;
      setMems(ms.docs.map(d=>({id:d.id,...d.data()}))); setLogs(ls.docs.map(d=>d.data())); setClub(cs.exists()?cs.data():{});
    }catch(e){ if(!alive)return;setLoadErr('אין הרשאה לקרוא את נתוני-ההתחשבנות, או שגיאת-רשת. ודא שאתה מחובר כבעל-קלאב/סוכן/שחקן מאושר.'); setMems([]);setLogs([]);setClub({}); }
  })(); return()=>{alive=false;};},[reload,authUser.uid]);

  const ownerUid = club?.ownerUid || (mems||[]).find(m=>[ROLES.CLUB_OWNER,ROLES.SUPER_ADMIN].includes(m.role))?.uid || '';
  const myMem = (mems||[]).find(m=>m.uid===authUser.uid);
  const role = (isGod || authUser.uid===ownerUid || (T.ownerEmails||[]).includes(email) || [ROLES.CLUB_OWNER,ROLES.SUPER_ADMIN,ROLES.MANAGER].includes(myMem?.role)) ? 'owner'
             : myMem?.role===ROLES.AGENT ? 'agent' : 'player';
  const from = cycleStartIL(wk), to = wk===0 ? Date.now() : cycleStartIL(wk-1);

  const view = useMemo(()=>{
    if(!mems||!logs) return null;
    const inWk=(r)=>(r.at||0)>=from&&(r.at||0)<to;
    const byUid={};
    logs.filter(inWk).forEach(l=>{ if(!l.uid) return; const b=byUid[l.uid]||(byUid[l.uid]={result:0,rake:0,n:0,rows:[]}); b.result=round2(b.result+(Number(l.profit)||0)); b.rake=round2(b.rake+(Number(l.rake)||0)); if(l.game&&l.game!=='adjust')b.n++; b.rows.push(l); });
    const real = mems.filter(m=>!m.isBot && m.uid!=='bot_bank' && m.status==='approved');
    const nameOf=(uid)=>(real.find(m=>m.uid===uid)||{}).username||'—';
    let scope = real;
    if(role==='agent') scope = real.filter(m=>m.agentUid===authUser.uid||m.uid===authUser.uid);
    if(role==='player') scope = real.filter(m=>m.uid===authUser.uid);
    const allPlayers = scope.map(m=>{ const b=byUid[m.uid]||{result:0,rake:0,n:0}; return {...m,wkResult:b.result,wkRake:b.rake,wkGames:b.n}; });
    const players = allPlayers.filter(p=>!q||(p.username||'').toLowerCase().includes(q.toLowerCase())||String(p.phone||'').includes(q)||String(p.playerId||'').includes(q));
    players.sort((a,b)=> sortBy==='balance'?(b.balance||0)-(a.balance||0):sortBy==='rake'?b.wkRake-a.wkRake:sortBy==='games'?b.wkGames-a.wkGames:b.wkResult-a.wkResult);
    const realRake = round2(real.reduce((s,m)=>s+(m.uid===ownerUid?0:((byUid[m.uid]||{}).rake||0)),0));
    const agentList = real.filter(m=>m.role===ROLES.AGENT && (role==='owner'||m.uid===authUser.uid));
    const agents = agentList.map(a=>{
      const kids = real.filter(m=>m.agentUid===a.uid).map(m=>{const b=byUid[m.uid]||{};return {...m,wkResult:b.result||0,wkRake:b.rake||0,wkGames:b.n||0};});
      const kidsResult=round2(kids.reduce((s,k)=>s+k.wkResult,0));
      const agentCut=round2(kids.reduce((s,k)=>s+(k.wkRake*(Number(k.agentPct)||0)/100),0));
      return {...a,kids,kidsResult,agentCut,settle:round2(kidsResult+agentCut)};
    });
    const totalAgentCut=round2(agents.reduce((s,a)=>s+a.agentCut,0));
    const ownerKids = real.filter(m=>!m.agentUid && m.uid!==ownerUid);
    const ownerKidsResult=round2(ownerKids.reduce((s,k)=>s+((byUid[k.uid]||{}).result||0),0));
    const ownerRakeKept=round2(realRake-totalAgentCut);
    // תוצאת כל השחקנים (בני-אדם) במחזור. חיובי = השחקנים ניצחו את הבית (הבוטים).
    const allPlayersResult=round2(real.filter(m=>m.uid!==ownerUid).reduce((s,m)=>s+((byUid[m.uid]||{}).result||0),0));
    // נטו בעל-הקלאב = מינוס תוצאת-השחקנים פחות נתחי-הסוכנים. הרייק כבר מקוזז בתוך המספר
    //   (תוצאות השחקנים הן *אחרי* רייק): כשאדם מנצח בוט, הבית מימן זאת; הרייק חוזר לבעלים.
    const ownerNet=round2(-allPlayersResult - totalAgentCut);
    // ברוטו ששולם לשחקנים ע"י הבוטים (לפני שהרייק חזר): להצגה בלבד.
    const botGrossToPlayers=round2(allPlayersResult + realRake);
    return {allPlayers,players,agents,realRake,totalAgentCut,ownerRakeKept,ownerKidsResult,allPlayersResult,ownerNet,botGrossToPlayers,byUid,nameOf};
  },[mems,logs,from,to,q,sortBy,role,authUser.uid,ownerUid]);

  const exportCSV=()=>{ if(!view)return;
    const head=['שחקן','טלפון','סוכן','משחקים',(role==='player'?null:'רייק'),'תוצאה','יתרה'].filter(Boolean);
    const lines=[head.join(',')];
    filtered.forEach(p=>{ const r=[p.username||'',p.phone||p.playerId||'',view.nameOf(p.agentUid)||'',p.wkGames,(role==='player'?null:round2(p.wkRake)),round2(p.wkResult),round2(p.balance||0)].filter(x=>x!==null); lines.push(r.map(x=>`"${(typeof x==='string'&&/^[=+@\-\t\r]/.test(x)?"'"+x:String(x)).replace(/"/g,'""')}"`).join(',')); });
    const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${TENANT_SLUG}-settlement-${wk}.csv`; a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  const [page,setPage]=useState('overview');
  const [agentFilter,setAgentFilter]=useState('all');
  const [resultFilter,setResultFilter]=useState('all');
  const [agentDrill,setAgentDrill]=useState(null);
  const closed=closedWeekEntry(club?.closedWeeks,from)?.[1]||null;
  const filtered=view ? view.players.filter(p=>(agentFilter==='all'||(agentFilter==='direct'?!p.agentUid:p.agentUid===agentFilter))&&(resultFilter==='all'||(resultFilter==='positive'?p.wkResult>0:resultFilter==='negative'?p.wkResult<0:p.wkGames===0))) : [];
  const scoped=view?.allPlayers||[];
  const shownAgent=view?.agents.find(a=>a.uid===agentDrill);
  const person=view?.allPlayers.find(p=>p.uid===drill);
  const activity=view ? scoped.flatMap(p=>((view.byUid[p.uid]||{}).rows||[]).map(r=>({...r,person:p.username,personUid:p.uid}))).sort((a,b)=>(b.at||0)-(a.at||0)) : [];
  const totalResult=round2(scoped.reduce((s,p)=>s+p.wkResult,0));
  const totalGames=scoped.reduce((s,p)=>s+p.wkGames,0);
  const nav=[['overview','סקירה שבועית','fa-chart-pie'],['players',role==='player'?'הכרטיס שלי':'שחקנים','fa-address-card'],...(role!=='player'?[['agents','סוכנים','fa-user-group']]:[]),['activity','יומן תנועות','fa-list']];
  const titles={overview:'מרכז ההתחשבנות',players:role==='player'?'הכרטיס שלי':'כרטיסי שחקנים',agents:'התחשבנות סוכנים',activity:'יומן תנועות'};
  const stat=(label,value,detail,tone='')=><article className={'metric '+tone}><span>{label}</span><strong dir="ltr">{value}</strong><small>{detail}</small></article>;
  const playerCard=p=><button key={p.uid} className="player-card" onClick={()=>setDrill(p.uid)} aria-label={'פתח כרטיס שחקן '+p.username}>
    <div className="person-head"><span className="avatar">{(p.username||'?').slice(0,2)}</span><div><strong>{p.username||'ללא שם'}</strong><small>{p.playerId||'ללא מספר שחקן'} · {p.agentUid?view.nameOf(p.agentUid):'שיוך ישיר לקלאב'}</small></div><span className="open-arrow">←</span></div>
    <div className="player-result"><span>תוצאת התקופה</span><strong className={p.wkResult>=0?'positive':'negative'} dir="ltr">₪ {money(p.wkResult)}</strong></div>
    <div className="card-stats"><div><small>יתרה נוכחית</small><b dir="ltr">₪ {money(p.balance||0)}</b></div><div><small>השתתפויות</small><b>{p.wkGames}</b></div>{role!=='player'&&<div><small>רייק לתקופה</small><b dir="ltr">₪ {money(p.wkRake)}</b></div>}</div>
    <div className="card-footer"><span>{p.phone||'טלפון לא הוזן'}</span><span>כרטיס מלא ופירוט תנועות ←</span></div>
  </button>;
  const agencyRows=()=>view.agents.length?<div className="agency-list">{view.agents.map(a=><button className="agency-row" key={a.uid} onClick={()=>setAgentDrill(a.uid)} aria-label={'פתח כרטיס סוכן '+a.username}>
    <span className="avatar agent-avatar">{(a.username||'?').slice(0,2)}</span><span className="agency-person"><strong>{a.username}</strong><small>{a.kids.length} שחקנים משויכים</small></span><span className="agency-amount"><small>נטו מחושב לתקופה</small><b dir="ltr">₪ {money(a.settle)}</b><small>{a.settle>0?'לזכות הסוכן':a.settle<0?'לזכות הקלאב':'מאוזן'}</small></span><span className={'badge '+(closed?.paid?.[a.uid]?'paid':'')}>{closed?.paid?.[a.uid]?'סומן שולם':'לא סומן תשלום'}</span><span>←</span>
  </button>)}</div>:<div className="empty-state">אין סוכנים להצגה בתחום ההרשאה שלך.</div>;
  return <div className="office-shell" dir="rtl">
    <aside className="office-sidebar"><div className="office-brand"><span className="brand-mark">C</span><div>CLUBCULATION<small>ניהול והתחשבנות</small></div></div><div className="club-label">{T.name}<span className="live-dot"/></div>
      <nav aria-label="ניווט ניהול">{nav.map(([id,label,icon])=><button key={id} className={page===id?'active':''} onClick={()=>setPage(id)} aria-current={page===id?'page':undefined}><i className={"fa-solid "+icon} aria-hidden="true"></i>{label}</button>)}</nav>
      <div className="sidebar-bottom"><span>{role==='owner'?'מנהל קלאב':role==='agent'?'חשבון סוכן':'חשבון שחקן'}</span><a href={T.appUrl||'/'}>חזרה לאפליקציה ←</a><button onClick={onLogout}>התנתקות</button></div>
    </aside>
    <main className="office-main"><header className="office-topbar"><span>{T.name} / ניהול / {titles[page]}</span><span className="account-pill">{authUser.displayName||'החשבון שלי'}</span></header>
      <div className="office-content"><div className="page-heading"><div><span className="eyebrow">המספרים שלך, במקום אחד</span><h1>{titles[page]}</h1><p>שחקנים, סוכנים ותנועות — עם פירוט מאחורי כל סכום.</p></div><div className="period-control"><label htmlFor="office-period">תקופת התחשבנות</label><select id="office-period" value={wk} onChange={e=>{setWk(Number(e.target.value));setDrill(null);setAgentDrill(null);}}>{Array.from({length:16},(_,i)=><option key={i} value={i}>{cycleLabel(i)}</option>)}</select><small>{closed?'קיים רישום סגירה לתקופה':'התקופה טרם סומנה כסגורה'}</small></div></div>
      {loadErr?<div className="office-error" role="alert"><h2>לא ניתן להציג סכומים כרגע</h2><p>{loadErr}</p><button onClick={()=>setReload(n=>n+1)}>נסה שוב</button></div>:!view?<div className="empty-state" role="status">טוענים את נתוני ההתחשבנות…</div>:<>
        <div className="metrics">{role==='owner'?<>{stat('תוצאת הקלאב',`₪ ${money(view.ownerNet)}`,'תוצאות השחקנים ועמלות הסוכנים','featured')}{stat('רייק נטו לקלאב',`₪ ${money(view.ownerRakeKept)}`,'רייק שנגבה פחות עמלות סוכנים')}{stat('עמלות סוכנים',`₪ ${money(view.totalAgentCut)}`,'חישוב לפי שיעורי העמלה הנוכחיים')}{stat('שחקנים פעילים',scoped.filter(p=>p.wkGames>0).length,`${totalGames} השתתפויות במשחקים בתקופה`)}</>:<>{stat('תוצאת התקופה',`₪ ${money(totalResult)}`,'תוצאות החשבונות בתחום ההרשאה שלך','featured')}{stat('השתתפויות במשחקים',totalGames,'בתקופה הנבחרת')}{role==='agent'&&stat('עמלת הסוכן',`₪ ${money(view.agents[0]?.agentCut||0)}`,'לפי שיעורי העמלה הנוכחיים')}</>}</div>
        {page==='overview'&&<><section className="weekly-banner"><div><span className="eyebrow">התחשבנות שבועית</span><h2>מתחילים מסיכום. ממשיכים לפירוט.</h2><p>בחר תקופה, בדוק את כרטיסי הסוכנים והשחקנים, וייצא את הנתונים לבקרה.</p></div><button className="primary-button" onClick={()=>setPage(role==='player'?'players':'agents')}>{role==='player'?'פתח את הכרטיס שלי':'בדיקת הסוכנים'} ←</button></section>
          <div className="overview-columns"><section className="office-panel"><div className="panel-heading"><h2>{role==='player'?'הכרטיס שלי':'סוכנים והתחשבנות'}</h2>{role!=='player'&&<button onClick={()=>setPage('agents')}>הצג הכל ←</button>}</div>{role==='player'?scoped.map(playerCard):agencyRows()}</section>
          <section className="office-panel"><div className="panel-heading"><h2>איך לקרוא את הסכומים</h2></div><dl className="money-explanation"><dt>תוצאת התקופה</dt><dd>רווחים והפסדים במשחקים, כולל תיקוני יומן שנרשמו.</dd><dt>יתרה נוכחית</dt><dd>היתרה בחשבון עכשיו. היא אינה יתרת פתיחה או סגירה של השבוע.</dd><dt>עמלת סוכן</dt><dd>הרייק של השחקנים המשויכים כפול אחוזי העמלה הנוכחיים.</dd><dt>תשלום בפועל</dt><dd>סימון “שולם” נקרא מדוח הסגירה. אין כאן התאמה להעברות בנקאיות.</dd></dl></section></div></>}
        {page==='players'&&<section className="office-panel"><div className="panel-heading"><h2>{filtered.length} כרטיסים</h2><button className="secondary-button" onClick={exportCSV}>ייצוא רשימת השחקנים ↓</button></div><div className="filters"><label className="search-field"><span>חיפוש שחקן</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="שם, טלפון או מספר שחקן"/></label>{role==='owner'&&<label><span>שיוך לסוכן</span><select value={agentFilter} onChange={e=>setAgentFilter(e.target.value)}><option value="all">כל הסוכנים</option><option value="direct">ישירות לקלאב</option>{view.agents.map(a=><option key={a.uid} value={a.uid}>{a.username}</option>)}</select></label>}<label><span>תוצאה ופעילות</span><select value={resultFilter} onChange={e=>setResultFilter(e.target.value)}><option value="all">כולם</option><option value="positive">תוצאה חיובית</option><option value="negative">תוצאה שלילית</option><option value="inactive">ללא משחקים בתקופה</option></select></label><label><span>מיון</span><select value={sortBy} onChange={e=>setSortBy(e.target.value)}><option value="result">תוצאת התקופה</option><option value="games">השתתפויות</option><option value="balance">יתרה נוכחית</option>{role!=='player'&&<option value="rake">רייק</option>}</select></label></div><div className="player-grid">{filtered.map(playerCard)}</div>{!filtered.length&&<div className="empty-state">לא נמצאו שחקנים התואמים לסינון.</div>}</section>}
        {page==='agents'&&role!=='player'&&<section className="office-panel"><div className="panel-heading"><h2>כל סוכן, עם השחקנים והחישוב שלו</h2></div><p className="panel-note">לחץ על סוכן כדי לראות את תוצאות שחקניו, עמלותיו והסכום המחושב. הסכום אינו אישור להעברת תשלום.</p>{agencyRows()}</section>}
        {page==='activity'&&<section className="office-panel"><div className="panel-heading"><h2>{activity.length} תנועות בתקופה</h2></div><div className="ledger-wrap"><table className="office-table"><thead><tr><th>תאריך</th><th>שחקן</th><th>סוג / משחק</th><th>תוצאה</th>{role!=='player'&&<th>רייק</th>}<th>פירוט</th></tr></thead><tbody>{activity.slice(0,500).map((r,i)=><tr key={i}><td>{new Date(r.at||0).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><button onClick={()=>setDrill(r.personUid)}>{r.person}</button></td><td>{r.game==='adjust'?'תיקון יומן':r.game==='rami'?'רמי סגור':r.game==='rummikub'?'רמיקוב':r.game||'תנועה'}</td><td className={(r.profit||0)>=0?'positive':'negative'} dir="ltr">₪ {money(r.profit)}</td>{role!=='player'&&<td dir="ltr">₪ {money(r.rake)}</td>}<td>{r.note||r.tableId||'—'}</td></tr>)}</tbody></table></div>{!activity.length&&<div className="empty-state">אין תנועות בתקופה הנבחרת.</div>}{activity.length>500&&<p className="panel-note">מוצגות 500 התנועות האחרונות בתקופה.</p>}</section>}
        <footer className="office-footnote">המידע מוצג לתקופה {cycleLabel(wk)}. חישובי עמלות היסטוריים מבוססים כרגע על שיעורי העמלה הנוכחיים; יתרות החשבון הן יתרות נוכחיות.</footer>
      </>}
      </div>
    </main>
    {shownAgent&&<OfficeDialog label={'כרטיס סוכן '+shownAgent.username} onClose={()=>setAgentDrill(null)}><button className="drawer-close" onClick={()=>setAgentDrill(null)}>סגור ✕</button><span className="eyebrow">כרטיס סוכן</span><h2>{shownAgent.username}</h2><p>{shownAgent.phone||'טלפון לא הוזן'} · {shownAgent.kids.length} שחקנים</p><div className="settlement-breakdown"><div><span>תוצאת השחקנים</span><b dir="ltr">₪ {money(shownAgent.kidsResult)}</b></div><div><span>עמלת הסוכן</span><b dir="ltr">₪ {money(shownAgent.agentCut)}</b></div><div className="breakdown-total"><span>נטו מחושב</span><b dir="ltr">₪ {money(shownAgent.settle)}</b></div></div><p className="panel-note">{shownAgent.settle>0?'הסכום המחושב לזכות הסוכן':shownAgent.settle<0?'הסכום המחושב לזכות הקלאב':'אין הפרש מחושב לתקופה'}. יש לבדוק תשלומים שכבר בוצעו בנפרד.</p><h3>השחקנים המשויכים</h3>{shownAgent.kids.map(p=><button className="drawer-player" key={p.uid} onClick={()=>{setAgentDrill(null);setDrill(p.uid);}}><span>{p.username}<small>עמלה: {p.agentPct||0}% · {p.wkGames} השתתפויות</small></span><b dir="ltr">₪ {money(p.wkResult)}</b></button>)}</OfficeDialog>}
    {person&&view&&<PlayerDrawer person={person} rows={(view.byUid[drill]||{}).rows||[]} agentName={person.agentUid?view.nameOf(person.agentUid):'ישירות לקלאב'} hideRake={role==='player'} onClose={()=>setDrill(null)}/>}
  </div>;
}

function OfficeDialog({label,onClose,children}){
  const panel=useRef(null),close=useRef(onClose);close.current=onClose;
  useEffect(()=>{const previous=document.activeElement;panel.current?.querySelector('button')?.focus();const key=e=>{
    if(e.key==='Escape'){e.preventDefault();close.current();}
    if(e.key==='Tab'){const items=[...panel.current.querySelectorAll('button,a[href],input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
  };const element=panel.current;element.addEventListener('keydown',key);return()=>{element.removeEventListener('keydown',key);if(previous?.isConnected)previous.focus();};},[]);
  return <div className="drawer-backdrop" onClick={onClose}><section ref={panel} className="detail-drawer" role="dialog" aria-modal="true" aria-label={label} onClick={e=>e.stopPropagation()}>{children}</section></div>;
}

function PlayerDrawer({person,rows,agentName,hideRake,onClose}){
  return <OfficeDialog label={'כרטיס שחקן '+person.username} onClose={onClose}><button className="drawer-close" onClick={onClose}>סגור ✕</button><span className="eyebrow">כרטיס שחקן</span><div className="person-head"><span className="avatar large">{(person.username||'?').slice(0,2)}</span><div><h2>{person.username}</h2><p>{person.playerId||'ללא מספר שחקן'}</p></div></div><dl className="profile-fields"><div><dt>טלפון</dt><dd>{person.phone||'לא הוזן'}</dd></div><div><dt>סוכן</dt><dd>{agentName}</dd></div><div><dt>סטטוס</dt><dd>{person.status==='approved'?'מאושר':person.status||'—'}</dd></div>{!hideRake&&<div><dt>אחוז עמלה</dt><dd>{person.agentPct||0}%</dd></div>}</dl><div className="profile-metrics"><div><small>תוצאת התקופה</small><strong className={person.wkResult>=0?'positive':'negative'} dir="ltr">₪ {money(person.wkResult)}</strong></div><div><small>יתרה נוכחית</small><strong dir="ltr">₪ {money(person.balance||0)}</strong></div></div><h3>תנועות בתקופה · {rows.length}</h3>{rows.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map((r,i)=><article className="profile-transaction" key={i}><div><b>{r.game==='adjust'?'תיקון יומן':r.game==='rami'?'רמי סגור':r.game==='rummikub'?'רמיקוב':r.game||'משחק'}</b><small>{new Date(r.at||0).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem'})}</small>{r.note&&<p>{r.note}</p>}</div><div><b className={(r.profit||0)>=0?'positive':'negative'} dir="ltr">₪ {money(r.profit)}</b>{!hideRake&&<small>רייק: {money(r.rake)}</small>}</div></article>)}{!rows.length&&<div className="empty-state">אין תנועות בתקופה הנבחרת.</div>}</OfficeDialog>;
}


function DrillModal({rows,name,hideRake,canToggle,onClose}){
  const [hide,setHide]=useState(!!hideRake);
  const games=rows.filter(r=>r.game!=='adjust').slice().sort((a,b)=>(b.at||0)-(a.at||0));
  const adjusts=rows.filter(r=>r.game==='adjust');
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:50,background:'rgba(3,7,15,.8)',backdropFilter:'blur(4px)',display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:640,maxHeight:'86vh',background:'var(--panel)',border:'1px solid var(--line)',borderTopLeftRadius:22,borderTopRightRadius:22,display:'flex',flexDirection:'column'}}>
        <div style={{padding:'16px 18px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <div style={{fontWeight:900,fontSize:16}}>פירוט משחקים · {name}</div>
          {canToggle && <button onClick={()=>setHide(h=>!h)} style={{background:hide?'var(--brand)':'var(--chip)',border:'1px solid var(--line)',color:hide?'#04121a':'var(--muted)',borderRadius:10,padding:'6px 12px',fontWeight:800,fontSize:12}}>{hide?'👁 חזרה לתצוגת בעלים':'צפה כמו השחקן'}</button>}
          <button onClick={onClose} style={{marginInlineStart:'auto',background:'var(--chip)',border:'1px solid var(--line)',color:'var(--muted)',borderRadius:10,padding:'6px 12px',fontWeight:800}}>סגור</button>
        </div>
        <div style={{overflowY:'auto',padding:'8px 12px 20px'}}>
          {games.length===0 && <div style={{color:'var(--faint)',textAlign:'center',padding:24,fontWeight:700}}>אין משחקים במחזור זה</div>}
          {games.map((g,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 8px',borderTop:i?'1px solid var(--line)':0}}>
              <div style={{fontSize:12,color:'var(--faint)',minWidth:104}}>{new Date(g.at||0).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
              <div style={{fontSize:12,color:'var(--muted)',flex:1}}>{g.game==='rummikub'?'רמיקוב':g.game==='rami'?'רמי':g.game||'משחק'}</div>
              {!hide && <div className="tnum" style={{fontSize:12,color:'var(--warn)',minWidth:70,textAlign:'left'}}>רייק {money(g.rake||0)}</div>}
              <div className="tnum" style={{fontWeight:800,color:col(g.profit||0),minWidth:82,textAlign:'left'}}>{(g.profit||0)>0?'+':''}{money(g.profit||0)}</div>
            </div>))}
          {adjusts.length>0 && <div style={{marginTop:12,paddingTop:10,borderTop:'1px dashed var(--line)'}}>
            <div style={{fontSize:11,color:'var(--faint)',fontWeight:800,marginBottom:4}}>תיקונים/הפקדות</div>
            {adjusts.map((g,i)=><div key={i} style={{display:'flex',gap:10,fontSize:12,padding:'4px 8px'}}><span style={{color:'var(--faint)'}}>{new Date(g.at||0).toLocaleDateString('he-IL')}</span><span style={{flex:1,color:'var(--muted)'}}>{g.note||'תיקון'}</span><span className="tnum" style={{color:col(g.profit||0)}}>{(g.profit||0)>0?'+':''}{money(g.profit||0)}</span></div>)}
          </div>}
        </div>
      </div>
    </div>
  );
}

const sel={background:'var(--chip)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:12,padding:'8px 12px',fontWeight:800,fontSize:13};
const sel2={background:'var(--chip)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:10,padding:'7px 10px',fontWeight:800,fontSize:12};
const tbl={width:'100%',borderCollapse:'collapse',fontSize:13.5};
const th={textAlign:'right',padding:'10px',color:'var(--faint)',fontWeight:800,fontSize:11,letterSpacing:'.04em',whiteSpace:'nowrap'};
const thN={...th,textAlign:'left'};
const td={padding:'11px 10px',verticalAlign:'middle'};
const tdN={...td,textAlign:'left',whiteSpace:'nowrap'};

function Card({label,val,tone}){ const c=tone==='brand'?'var(--brand)':tone==='warn'?'var(--warn)':tone==='gold'?'var(--gold)':'var(--ink)';
  return <div style={{background:'var(--panel)',border:'1px solid var(--line)',borderRadius:16,padding:'14px 16px'}}><div style={{fontSize:11,color:'var(--faint)',fontWeight:800,marginBottom:6}}>{label}</div><div className="tnum" style={{fontSize:22,fontWeight:900,color:c}}>{val}</div></div>; }
function Section({title,right,children}){ return <div style={{background:'var(--panel)',border:'1px solid var(--line)',borderRadius:18,padding:'14px 14px 12px',marginBottom:16}}><div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}><h2 style={{fontSize:15,fontWeight:900}}>{title}</h2><div style={{marginInlineStart:'auto'}}>{right}</div></div>{children}</div>; }
function KV({k,v}){ return <div><div style={{fontSize:11,color:'var(--faint)',fontWeight:800}}>{k}</div><div className="tnum" style={{fontSize:20,fontWeight:900}}>{v}</div></div>; }
function SettleCell({v}){ const pos=v>0.009,neg=v<-0.009; return <span className="tnum" style={{fontWeight:900,color:pos?'var(--pos)':neg?'var(--neg)':'var(--muted)'}}>{money(v)} <span style={{fontSize:10,fontWeight:800,opacity:.8}}>{pos?'הקלאב משלם':neg?'מעביר לקלאב':''}</span></span>; }

try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  window.__boMounted = true;
} catch (e) {
  if (window.__boFail) window.__boFail('שגיאה: ' + (e && e.message ? e.message : e));
}
</script>
</body>
</html>
